apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  NODE_ENV: {{ .Values.env.nodeEnv | default "production" | quote }}
  DEFAULT_TENANT_ID: {{ .Values.env.defaultTenantId | default "tenant-eu-energy" | quote }}
  DEFAULT_FACILITY_ID: {{ .Values.env.defaultFacilityId | default "DU-03" | quote }}
  JWT_EXPIRATION_SEC: {{ .Values.env.jwtExpirationSec | default "3600" | quote }}
  CORS_ORIGIN: {{ .Values.config.corsOrigin | default "https://cems.climatesphere.internal" | quote }}
  SIMULATION_INTERVAL_MS: {{ .Values.config.simulationIntervalMs | default "1000" | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | default "info" | quote }}
