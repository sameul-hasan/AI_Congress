apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | default "cs_enterprise_jwt_super_secret_signing_key_production_2026" | quote }}
  db-password: {{ .Values.secrets.dbPassword | default "cs_dev_cluster_2026" | quote }}
