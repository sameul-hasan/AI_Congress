<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#091420" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#02070e" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Luminous Core Gradient -->
    <radialGradient id="coreGlow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#00f5d4"/>
      <stop offset="60%" stop-color="#00c8b3"/>
      <stop offset="85%" stop-color="#4361ee"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </radialGradient>

    <!-- Orbital Ring 1 Gradient -->
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4361ee" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Orbital Ring 2 Gradient -->
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb426" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff5370" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Orbital Ring 3 Gradient -->
    <linearGradient id="orbitGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4361ee" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#spaceGlow)"/>

  <!-- Orbital Ellipse 1 (Horizontal Inclined) -->
  <g transform="rotate(-28 256 256)" filter="url(#bloom)">
    <ellipse cx="256" cy="256" rx="200" ry="70" fill="none" stroke="url(#orbitGrad1)" stroke-width="4.5" stroke-dasharray="850" stroke-dashoffset="40"/>
    <circle cx="456" cy="256" r="6" fill="#00f5d4" filter="url(#bloom)"/>
    <circle cx="56" cy="256" r="4" fill="#00f0ff" opacity="0.8"/>
  </g>

  <!-- Orbital Ellipse 2 (Counter Inclined) -->
  <g transform="rotate(38 256 256)" filter="url(#bloom)">
    <ellipse cx="256" cy="256" rx="190" ry="60" fill="none" stroke="url(#orbitGrad2)" stroke-width="3.5"/>
    <circle cx="446" cy="256" r="5" fill="#ffb426" filter="url(#bloom)"/>
    <circle cx="66" cy="256" r="3.5" fill="#ff5370" opacity="0.8"/>
  </g>

  <!-- Orbital Ellipse 3 (Polar Arc) -->
  <g transform="rotate(82 256 256)">
    <ellipse cx="256" cy="256" rx="180" ry="50" fill="none" stroke="url(#orbitGrad3)" stroke-width="3" stroke-dasharray="14 10"/>
    <circle cx="436" cy="256" r="4.5" fill="#4361ee" filter="url(#bloom)"/>
  </g>

  <!-- Core Outer Halo -->
  <circle cx="256" cy="256" r="115" fill="#00f5d4" opacity="0.12" filter="url(#subtleGlow)"/>
  <circle cx="256" cy="256" r="95" fill="#4361ee" opacity="0.2" filter="url(#bloom)"/>

  <!-- Central Quantum Globe Body -->
  <circle cx="256" cy="256" r="82" fill="url(#coreGlow)" filter="url(#bloom)"/>

  <!-- Continental Grid Mesh Overlays on Globe -->
  <g opacity="0.45" stroke="#ffffff" stroke-width="1.2" fill="none">
    <ellipse cx="256" cy="256" rx="82" ry="32"/>
    <ellipse cx="256" cy="256" rx="82" ry="58"/>
    <path d="M 256 174 L 256 338"/>
    <path d="M 205 186 C 220 220, 220 292, 205 326"/>
    <path d="M 307 186 C 292 220, 292 292, 307 326"/>
  </g>

  <!-- Luminous Specular Highlights -->
  <ellipse cx="226" cy="216" rx="30" ry="16" transform="rotate(-30 226 216)" fill="#ffffff" opacity="0.6" filter="url(#bloom)"/>
  <circle cx="210" cy="205" r="7" fill="#ffffff" opacity="0.85"/>

  <!-- Quantum Particle Nodes -->
  <circle cx="160" cy="140" r="3" fill="#00f5d4" opacity="0.75" filter="url(#bloom)"/>
  <circle cx="360" cy="120" r="2.5" fill="#00f0ff" opacity="0.65"/>
  <circle cx="380" cy="370" r="3.5" fill="#ffb426" opacity="0.75" filter="url(#bloom)"/>
  <circle cx="130" cy="360" r="2.5" fill="#4361ee" opacity="0.6"/>
</svg>
