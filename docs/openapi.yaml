openapi: 3.1.0
info:
  title: ClimateSphere AI — Industrial Edge Gateway & Telemetry API
  description: >
    Enterprise environmental compliance, CEMS continuous telemetry, DIN EN 14181 QAL3 quality assurance,
    and cryptographic Merkle audit API under EU Industrial Emissions Directive (IED 2010/75/EU) and CSRD ESRS E1.
  version: 4.8.0
  contact:
    name: ClimateSphere AI Engineering Team
    email: engineering@climatesphere.ai

servers:
  - url: http://localhost:8089
    description: Local Edge Gateway Microservice
  - url: https://localhost:8443
    description: Production Nginx TLS Reverse Proxy

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RFC 7519 HMAC-SHA256 JSON Web Token obtained from /api/auth/token

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: HEALTHY
        service:
          type: string
        version:
          type: string
        protocols:
          type: array
          items:
            type: string
        uptimeSec:
          type: integer

    TokenRequest:
      type: object
      properties:
        username:
          type: string
          example: operator@climatesphere.ai
        password:
          type: string
        role:
          type: string
          enum: [ADMIN, ENGINEER, OPERATOR, AUDITOR]
          default: OPERATOR

    TokenResponse:
      type: object
      properties:
        tokenType:
          type: string
          example: Bearer
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 3600
        claims:
          type: object

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    TelemetryPacket:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        facilityId:
          type: string
          example: DU-03
        sequence:
          type: integer
        channels:
          type: object
          properties:
            SO2:
              $ref: '#/components/schemas/ChannelData'
            NOx:
              $ref: '#/components/schemas/ChannelData'
            CO:
              $ref: '#/components/schemas/ChannelData'
            O2:
              $ref: '#/components/schemas/ChannelData'

    ChannelData:
      type: object
      properties:
        val:
          type: number
        normVal:
          type: number
        units:
          type: string
          example: mg/Nm3
        refO2:
          type: number
          example: 6.0
        status:
          type: string
          enum: [COMPLIANT, WARNING, BREACH]

    QAL3Calibration:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
        facilityId:
          type: string
        parameter:
          type: string
        zeroDrift:
          type: number
        spanDrift:
          type: number
        precisionSd:
          type: number
        cusumValue:
          type: number
        status:
          type: string
          enum: [PASS, ACTION_REQUIRED]
        gasBottleLot:
          type: string
        gasCertNumber:
          type: string
        operator:
          type: string

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
        actor:
          type: string
        action:
          type: string
        facilityId:
          type: string
        details:
          type: string
        prevHash:
          type: string
        merkleHash:
          type: string

    AdminUser:
      type: object
      properties:
        username:
          type: string
        role:
          type: string
          enum: [ADMIN, ENGINEER, OPERATOR, AUDITOR]
        title:
          type: string
        tenantId:
          type: string
        status:
          type: string
          example: ACTIVE

    CreateUserRequest:
      type: object
      required:
        - username
        - password
        - role
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [ADMIN, ENGINEER, OPERATOR, AUDITOR]
        title:
          type: string
        tenantId:
          type: string

    WebhookSubscription:
      type: object
      required:
        - url
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        secret:
          type: string

    IncidentRecord:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
        facilityId:
          type: string
        severity:
          type: string
          enum: [CRITICAL, MAJOR, MINOR]
        status:
          type: string
          enum: [OPEN, INVESTIGATING, RESOLVED]
        pollutant:
          type: string
        details:
          type: string

    AssetHierarchy:
      type: object
      properties:
        tenantId:
          type: string
        tenantName:
          type: string
        facilities:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              region:
                type: string
              status:
                type: string
              analyzers:
                type: array
                items:
                  type: string

    CarbonInventory:
      type: object
      properties:
        timestamp:
          type: string
        reportingPeriod:
          type: string
        scope1:
          type: object
        scope2:
          type: object
        scope3:
          type: object
        totalKtCo2e:
          type: number

paths:
  /health:
    get:
      summary: Health & Protocol Diagnostic Probe
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/token:
    post:
      summary: Request HMAC-SHA256 JWT Access & Refresh Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request payload

  /api/auth/verify:
    get:
      summary: Validate JWT and Inspect Claims
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
        '401':
          description: Invalid, expired, or revoked token

  /api/auth/refresh:
    post:
      summary: Silent Access Token Renewal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access and refresh token pair
        '401':
          description: Refresh token invalid or expired

  /api/auth/revoke:
    post:
      summary: Invalidate an Active Session Token
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token revoked successfully
        '401':
          description: Unauthorized

  /api/auth/register:
    post:
      summary: Self-Service Operator Registration
      description: Create a new plant user account with Scrypt password hashing and automatic JWT issuance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName:
                  type: string
                  example: Johann
                lastName:
                  type: string
                  example: Schmidt
                email:
                  type: string
                  format: email
                  example: j.schmidt@vattenfall.de
                password:
                  type: string
                  format: password
                  example: EnterprisePassword2026!
                role:
                  type: string
                  enum: [ADMIN, ENGINEER, OPERATOR, AUDITOR]
                  default: ENGINEER
                organisation:
                  type: string
                  example: Vattenfall Europe
      responses:
        '201':
          description: User created and authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ACCOUNT_CREATED
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  role:
                    type: string
        '400':
          description: Missing required fields or password policy violation
        '409':
          description: Account with this email already exists

  /api/auth/google/init:
    get:
      summary: Initialize Server-Side Google OAuth 2.0 PKCE Flow
      description: Returns OAuth authorization URL or fallback indicator if server credentials are unset
      responses:
        '200':
          description: Google OAuth initialization payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  authUrl:
                    type: string
                  state:
                    type: string
                  status:
                    type: string

  /api/auth/google/callback:
    post:
      summary: Process Google OAuth 2.0 Authorization Code Exchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                state:
                  type: string
      responses:
        '200':
          description: OAuth code exchanged for JWT session
        '400':
          description: Invalid authorization code

  /api/auth/password-reset:
    post:
      summary: Request Account Password Recovery Reset Link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset request queued securely without user enumeration

  /api/auth/sso/login:
    get:
      summary: Initiate Federated Enterprise Single Sign-On (OIDC/SAML)
      parameters:
        - name: provider
          in: query
          description: Federated IdP provider (microsoft_entra, okta, ping_identity, keycloak)
          schema:
            type: string
            enum: [microsoft_entra, azure_ad, okta, ping_identity, keycloak]
            default: microsoft_entra
        - name: tenantId
          in: query
          description: Multi-tenant partition ID
          schema:
            type: string
            default: tenant-eu-energy
      responses:
        '200':
          description: SSO authorization payload with state, nonce, PKCE challenge, and redirect URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: REDIRECT_READY
                  provider:
                    type: string
                  authorizationUrl:
                    type: string
                  state:
                    type: string
                  codeChallenge:
                    type: string

  /api/auth/sso/callback:
    post:
      summary: Exchange Federated Authorization Code for Platform JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                state:
                  type: string
                provider:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: Authenticated session with RFC 7519 JWT and user persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid or expired SSO state parameter

  /api/telemetry/fleet:
    get:
      summary: Fleet-Wide Real-Time CEMS Telemetry Snapshot
      responses:
        '200':
          description: Current telemetry across all 5 facilities

  /api/telemetry/history:
    get:
      summary: Store-and-Forward Replay Buffer
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Buffered historical packets

  /api/telemetry/ingest:
    post:
      summary: Ingest Physical CEMS Readings with Quality Flagging
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                facilityId:
                  type: string
                so2:
                  type: number
                nox:
                  type: number
                o2:
                  type: number
      responses:
        '201':
          description: Packet successfully ingested
        '401':
          description: Unauthorized
        '413':
          description: Request body too large (max 1 MB)

  /api/telemetry/rollups:
    get:
      summary: Statutory 15-Minute Rolling Average Rollups (IED Art 15)
      parameters:
        - name: facility
          in: query
          schema:
            type: string
            default: DU-03
        - name: window
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Calculated statutory averages

  /api/qal3/calibrations:
    get:
      summary: Retrieve DIN EN 14181 QAL3 Calibration Ledger
      responses:
        '200':
          description: List of calibration records
    post:
      summary: Record Certified QAL3 Drift Assessment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QAL3Calibration'
      responses:
        '201':
          description: Calibration recorded
        '401':
          description: Unauthorized
        '403':
          description: Requires TRIGGER_CALIBRATION permission

  /api/audit/logs:
    get:
      summary: Query Hash-Chained Audit Ledger
      responses:
        '200':
          description: Array of audit entries
    post:
      summary: Append Immutable Audit Record to Merkle Chain
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                facilityId:
                  type: string
                details:
                  type: string
      responses:
        '201':
          description: Audit log persisted and chained
        '401':
          description: Unauthorized

  /api/audit/verify:
    get:
      summary: Verify Cryptographic Merkle Root Integrity
      responses:
        '200':
          description: Tamper verification result with root hash

  /api/alerts:
    get:
      summary: List Active Exceedance Alerts
      responses:
        '200':
          description: Current alert list
    post:
      summary: Acknowledge Active Alert
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alertId:
                  type: string
                note:
                  type: string
      responses:
        '200':
          description: Alert acknowledged
        '401':
          description: Unauthorized

  /api/incidents:
    get:
      summary: Query Historical & Active Statutory Exceedance Incidents
      responses:
        '200':
          description: Incident list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentRecord'
    post:
      summary: Acknowledge or Resolve Environmental Incident
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - incidentId
              properties:
                incidentId:
                  type: string
                resolutionNote:
                  type: string
      responses:
        '200':
          description: Incident updated
        '401':
          description: Unauthorized

  /api/assets/hierarchy:
    get:
      summary: Enterprise Multi-Tenant Facility, Unit & Analyzer Asset Hierarchy
      responses:
        '200':
          description: Hierarchical asset tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetHierarchy'

  /api/carbon/inventory:
    get:
      summary: Real-Time Scope 1, 2, 3 GHG Carbon Accounting & Traceability Lineage
      responses:
        '200':
          description: Verified GHG inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbonInventory'

  /api/protocols/modbus/read:
    get:
      summary: Modbus TCP/RTU Fieldbus Register Driver
      parameters:
        - name: unitId
          in: query
          schema:
            type: integer
            default: 1
        - name: address
          in: query
          schema:
            type: integer
            default: 40001
        - name: count
          in: query
          schema:
            type: integer
            default: 4
      responses:
        '200':
          description: Decoded Modbus holding registers

  /api/protocols/opcua:
    get:
      summary: OPC-UA (IEC 62541) Node Address Space
      responses:
        '200':
          description: Active CEMS nodes and quality status

  /api/protocols/mqtt:
    get:
      summary: MQTT Sparkplug B Topic & Driver Status
      responses:
        '200':
          description: MQTT metrics and broker state

  /api/protocols/fieldbus/config:
    get:
      summary: List Configured Physical Industrial Fieldbus Drivers
      responses:
        '200':
          description: Physical Modbus TCP / OPC-UA master hardware endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  fieldbusEndpoints:
                    type: array
                    items:
                      type: object
                      properties:
                        facilityId:
                          type: string
                        driverType:
                          type: string
                        host:
                          type: string
                        port:
                          type: integer
                        unitId:
                          type: integer

  /api/protocols/fieldbus/poll:
    post:
      summary: Trigger Live Hardware Socket Register Poll (Modbus TCP)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                facilityId:
                  type: string
                host:
                  type: string
                port:
                  type: integer
                unitId:
                  type: integer
                startAddr:
                  type: integer
                quantity:
                  type: integer
      responses:
        '200':
          description: Live physical register frame and decoded pollutant channels
        '500':
          description: Fieldbus TCP socket error

  /api/ai/query:
    post:
      summary: Google Gemini 2.0 Flash Regulatory AI Proxy
      security:
        - bearerAuth: []
      parameters:
        - name: X-CS-ApiKey
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Generated AI response
        '401':
          description: Authentication required
        '503':
          description: Server GEMINI_API_KEY missing

  /api/ai/approve-action:
    post:
      summary: Human-in-the-Loop AI Recommendation Approval
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actionId:
                  type: string
                actionType:
                  type: string
                facilityId:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Action approved and logged to Merkle audit chain
        '401':
          description: Unauthorized

  /api/admin/users:
    get:
      summary: Retrieve Active Platform Operators & RBAC Roles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of registered users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '401':
          description: Unauthorized

  /api/admin/users/create:
    post:
      summary: Provision New Operator Account with RBAC Role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
        '400':
          description: Invalid input or user already exists
        '401':
          description: Unauthorized (Requires Admin role)

  /api/admin/users/reset-password:
    post:
      summary: Administrative Password Reset
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - newPassword
              properties:
                username:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password reset successfully
        '401':
          description: Unauthorized

  /api/admin/secrets/status:
    get:
      summary: Inspect Cloud Secret Vault Engine Health & Active Keys
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Vault provider status, sync timestamp, and managed key names
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                  vaultAddress:
                    type: string
                  lastSync:
                    type: string
                  managedKeys:
                    type: array
                    items:
                      type: string
                  status:
                    type: string

  /api/notifications/webhooks:
    get:
      summary: List Registered Webhook Alert Subscriptions
      responses:
        '200':
          description: Webhook subscriptions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookSubscription'
    post:
      summary: Register Outbound Webhook Integration (Slack, PagerDuty, MS Teams)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscription'
      responses:
        '201':
          description: Webhook subscription active
        '400':
          description: Invalid URL (must start with https://)

  /metrics:
    get:
      summary: Prometheus / OpenMetrics System & Industrial Telemetry Observability
      responses:
        '200':
          description: OpenMetrics Prometheus metrics plain-text scrape format
          content:
            text/plain:
              schema:
                type: string

  /api/protocols/fieldbus/write:
    post:
      summary: Write Modbus Fieldbus Coil or Register (FC 05, 06, 16)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                facilityId:
                  type: string
                functionCode:
                  type: integer
                  enum: [5, 6, 16]
                address:
                  type: integer
                value:
                  type: integer
                values:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Fieldbus write acknowledged
        '400':
          description: Invalid parameters
        '401':
          description: Unauthorized

  /api/protocols/fieldbus/rtu/poll:
    get:
      summary: Physical RS-485 Modbus RTU Serial Register Poll with CRC-16 Verification
      parameters:
        - name: facilityId
          in: query
          schema:
            type: string
        - name: unitId
          in: query
          schema:
            type: integer
        - name: startAddr
          in: query
          schema:
            type: integer
        - name: quantity
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Raw and decoded Modbus RTU frame with verified CRC-16

  /api/admin/security/mtls-status:
    get:
      summary: IEC 62443 Zero-Trust mTLS & Client Certificate Verification Status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operational mTLS status

  /api/admin/cluster/status:
    get:
      summary: Multi-Node Distributed Cluster & State Engine Status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Distributed Redis / Memory state engine status

  /api/admin/migrations:
    get:
      summary: Reversible Database Migrations Status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of applied and pending migrations
    post:
      summary: Apply or Rollback Database Migrations
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [APPLY, ROLLBACK]
                targetVersion:
                  type: string
      responses:
        '200':
          description: Migration transaction executed

  /api/protocols/serial/status:
    get:
      summary: Physical OS RS-485 Serial Port Status
      responses:
        '200':
          description: Physical UART binding status and baud rate

  /api/protocols/serial/open:
    post:
      summary: Bind and Open Physical OS SerialPort UART
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  example: /dev/ttyUSB0
                baudRate:
                  type: integer
                  example: 19200
      responses:
        '200':
          description: SerialPort binding opened

  /api/protocols/opcua/subscription/create:
    post:
      summary: Create Continuous OPC-UA Push Subscription (IEC 62541-4)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                facilityId:
                  type: string
                publishingInterval:
                  type: integer
                nodes:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Continuous subscription initialized

  /api/protocols/opcua/subscription/publish:
    get:
      summary: Retrieve Next Asynchronous PublishNotification in Subscription Loop
      parameters:
        - name: subscriptionId
          in: query
          schema:
