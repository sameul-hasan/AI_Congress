[databases]
climatesphere_tsdb = host=timescaledb port=5432 dbname=climatesphere_tsdb auth_user=climatesphere

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = climatesphere
stats_users = climatesphere

# Connection Pool Management
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 15
reserve_pool_timeout = 5.0
max_db_connections = 100
max_user_connections = 100

# High-Frequency CEMS Telemetry Tuning
server_round_robin = 1
server_idle_timeout = 600.0
server_connect_timeout = 15.0
server_login_retry = 15.0
client_idle_timeout = 0.0
client_login_timeout = 60.0
query_timeout = 120.0
query_wait_timeout = 120.0

# TLS / Security Settings
client_tls_sslmode = prefer
server_tls_sslmode = prefer

# Logging & Monitoring
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
